# Include inside nginx's http context (for example /etc/nginx/conf.d/).
# Replace the domain and certificate paths before enabling this file.
map $http_upgrade $new_api_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://api.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/nginx/ssl/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.example.com/privkey.pem;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $new_api_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ^~ /v1/dashboard/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location ~ ^/(v1|v1beta|pg|mj)(/|$) {
        proxy_pass http://127.0.0.1:3002;
    }
    location ~ ^/[^/]+/mj(/|$) {
        proxy_pass http://127.0.0.1:3002;
    }
    # Add data-plane locations for custom plugin prefixes when used.
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
