events {}
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream control_plane { server new-api:3000; }
    upstream data_plane { server new-api-data:3000; }
    server {
        listen 3000;
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Legacy billing queries are management APIs despite their /v1 prefix.
        location ^~ /v1/dashboard/ { proxy_pass http://control_plane; }
        location ~ ^/(v1|v1beta|pg|mj)(/|$) { proxy_pass http://data_plane; }
        location ~ ^/[^/]+/mj(/|$) { proxy_pass http://data_plane; }
        # Add locations here for custom plugin routes outside the prefixes above.
        location / { proxy_pass http://control_plane; }
    }
}
