# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. make dev-web
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/new_api_logs
      - REDIS_CONN_STRING=redis://dragonfly
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin. This does not configure relay CORS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
    depends_on:
      dragonfly:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - dev-network

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    ulimits:
      memlock: -1
    container_name: new-api-dev-dragonfly
    restart: unless-stopped
    command: ["--cache_mode=false"]
    networks:
      - dev-network

  postgres:
    # PostgreSQL 18 stores cluster data under /var/lib/postgresql/18/docker.
    image: postgres:18-alpine
    container_name: new-api-dev-pg
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "io_method=worker"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: new-api-dev-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: new_api_logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 123456
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - dev_clickhouse_data:/var/lib/clickhouse
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "123456", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dev_data:
  dev_pg_data:
  dev_clickhouse_data:

networks:
  dev-network:
    driver: bridge
